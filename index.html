        };
      }

      if (effectiveSpecs.length === 1) {
        const spec = effectiveSpecs[0];
        return {
          label: bassChordName(spec, bassProfile.modifier),
          midis: [...new Set(bassChordMidisForSpec(spec, bassProfile.modifier))].sort((a, b) => a - b)
        };
      }

      const combined = effectiveSpecs.flatMap(spec => bassChordMidisForSpec(spec, false));
      const seventhRootPc = detectedSeventhRootPc(combined);
      if (seventhRootPc === null) return null;
      const midis = adjustedSeventhChordMidis(effectiveSpecs, combined, bassProfile.modifier, seventhRootPc);
      const intervals = [...new Set(midis.map(midi => mod(mod(midi, 12) - seventhRootPc, 12)))];
      const rootSpec = effectiveSpecs.find(spec => spec.rootPc === seventhRootPc);
      return {
        label: chordNameForIntervals(seventhRootPc, intervals, rootSpec?.rootName ?? rootNameForPc(seventhRootPc)),
        midis
      };
    }

    function stopBassVoices(releaseOverride = null) {
      for (const id of [...voices.keys()]) {
        if (id.startsWith("bass-")) stopVoice(id, releaseOverride);
      }
      els.bassDock.querySelectorAll(".bass-button.is-active, .bass-seventh-button.is-active").forEach(button => button.classList.remove("is-active"));
    }

    function stopVoicesForProfile(profile, releaseOverride = 0.08) {
      for (const [id, voice] of [...voices.entries()]) {
        if (voice.profile === profile) stopVoice(id, releaseOverride);
      }
    }

    function updateBassVoices(releaseOverride = bassFadeTime()) {
      stopBassVoices(releaseOverride);
      if (!bassProfile.enabled) return;
      const chord = currentBassChord();
      if (!chord) return;
      bassVoiceSerial += 1;
      chord.midis.forEach((midi, index) => {
        startVoice(sourceFromMidi(midi, chord.label), `bass-${bassVoiceSerial}-${index}`, 0, bassProfile);
      });
      setReadout(chord.label, `${tr("bassPart")} · ${chord.midis.map(midi => noteNameForPcInKey(midi)).join(" ")}`);
      for (const code of bassProfile.pressedCodes) {
        els.bassDock.querySelector(`[data-bass-code="${code}"]`)?.classList.add("is-active");
      }
      for (const index of bassProfile.pressedSevenths) {
        els.bassDock.querySelector(`[data-bass-seventh-index="${index}"]`)?.classList.add("is-active");
      }
      if (bassProfile.seventhMode) {
        const spec = [...bassProfile.pressedCodes].map(code => bassSpecByCode(code)).find(Boolean);
        if (spec?.index < 7) els.bassDock.querySelector(`[data-bass-seventh-index="${spec.index}"]`)?.classList.add("is-active");
      }
    }

    function isBassSeventhActive() {
      const chord = currentBassChord();
      return Boolean(chord && chord.midis.length >= 4);
    }

    function enforceSingleBassCodeForSeventhMode() {
      if (!bassProfile.seventhMode || bassProfile.pressedCodes.size <= 1) return;
      const firstCode = bassProfile.pressedCodes.values().next().value;
      bassProfile.pressedCodes = firstCode ? new Set([firstCode]) : new Set();
      for (const [pointerId, code] of [...bassProfile.activePointerCodes.entries()]) {
        if (code !== firstCode) bassProfile.activePointerCodes.delete(pointerId);
      }
    }

    function updateBassVoicesForRecognition(wasSeventhActive = false) {
      updateBassVoices(!wasSeventhActive && isBassSeventhActive() ? 0.03 : bassFadeTime());
    }

    function setBassEnabled(enabled) {
      bassProfile.enabled = Boolean(enabled);
      if (!bassProfile.enabled) {
        bassProfile.pressedCodes.clear();
        bassProfile.pressedSevenths.clear();
        bassProfile.suppressedTriadCodes.clear();
        bassProfile.activePointerCodes.clear();
        bassProfile.activePointerSevenths.clear();
        bassProfile.modifier = false;
        bassProfile.seventhMode = false;
        stopBassVoices(bassFadeTime());
      }
      const viewAnchor = captureViewAnchor();
      renderBassDock();
      renderKeyboard({ viewAnchor });
      renderScaleStaff();
    }

    function setBassKeyMode(mode) {
      if (!bassKeyModeValues.has(mode) || mode === bassKeyMode()) return;
      bassProfile.keyMode = mode;
      bassProfile.pressedCodes.clear();
      bassProfile.pressedSevenths.clear();
      bassProfile.suppressedTriadCodes.clear();
      bassProfile.activePointerCodes.clear();
      bassProfile.activePointerSevenths.clear();
      bassProfile.modifier = false;
      bassProfile.seventhMode = false;
      stopBassVoices(bassFadeTime());
      const viewAnchor = captureViewAnchor();
      renderMappingProfileOptions();
      renderBassDock();
      renderKeyboard({ viewAnchor });
      renderScaleStaff();
    }

    function setProfileEnabled(profile, enabled) {
      if (profile === bassProfile) {
        setBassEnabled(enabled);
        return;
      }

      profile.enabled = Boolean(enabled);
      if (!profile.enabled) {
        for (const [code, pending] of [...pendingBrowserStarts.entries()]) {
          if (pending.profileId !== profile.id) continue;
          window.clearTimeout(pending.timer);
          pendingBrowserStarts.delete(code);
        }
        if (profile === pointerProfile) clearGlissandoStates();
        releaseProfilePressedCodes(profile);
        stopVoicesForProfile(profile, 0.08);
      }

      const viewAnchor = captureViewAnchor();
      renderMappingProfileOptions();
      renderKeyboard({ viewAnchor });
      renderScaleStaff();
    }

    function renderBassDock() {
      if (!bassProfile.enabled) {
        els.bassDock.hidden = true;
        els.bassDock.replaceChildren();
        return;
      }

      const fragment = document.createDocumentFragment();
      const leftHint = document.createElement("div");
      leftHint.className = "bass-dock-hint is-left";
      leftHint.textContent = `${activeBassSeventhKeyLabel()}切换七和弦`;
      const keysWrap = document.createElement("div");
      keysWrap.className = "bass-dock-keys";
      const rightHint = document.createElement("div");
      rightHint.className = "bass-dock-hint is-right";
      rightHint.textContent = "·切换和弦类型";
      const diatonicSevenths = bassDiatonicSevenths();
      for (const spec of bassSpecs()) {
        const wrap = document.createElement("div");
        wrap.className = "bass-button-wrap";
        if (!bassProfile.seventhMode && spec.index < 7) {
          const seventh = diatonicSevenths[spec.index];
          const seventhButton = document.createElement("button");
          seventhButton.type = "button";
          seventhButton.className = "bass-seventh-button";
          seventhButton.dataset.bassSeventhIndex = String(seventh.index);
          if (seventh.isNinth) {
            seventhButton.classList.add("is-ninth");
            seventhButton.style.setProperty("--bass-center-hue", String(hueForPitchClass(seventh.tonePcs.root)));
            seventhButton.style.setProperty("--bass-left-top-hue", String(hueForPitchClass(seventh.tonePcs.ninth)));
            seventhButton.style.setProperty("--bass-right-top-hue", String(hueForPitchClass(seventh.tonePcs.fifth)));
            seventhButton.style.setProperty("--bass-left-bottom-hue", String(hueForPitchClass(seventh.tonePcs.third)));
            seventhButton.style.setProperty("--bass-right-bottom-hue", String(hueForPitchClass(seventh.tonePcs.seventh)));
            const center = document.createElement("i");
            center.className = "bass-ninth-center";
            center.setAttribute("aria-hidden", "true");
            seventhButton.append(center);
          } else {
            seventhButton.style.setProperty("--bass-left-top-hue", String(hueForPitchClass(seventh.tonePcs.seventh)));
            seventhButton.style.setProperty("--bass-right-top-hue", String(hueForPitchClass(seventh.tonePcs.fifth)));
            seventhButton.style.setProperty("--bass-left-bottom-hue", String(hueForPitchClass(seventh.tonePcs.third)));
            seventhButton.style.setProperty("--bass-right-bottom-hue", String(hueForPitchClass(seventh.tonePcs.root)));
          }
          const leftKey = document.createElement("span");
          leftKey.textContent = seventh.keyA;
          const rightKey = document.createElement("span");
          rightKey.textContent = seventh.keyB;
          seventhButton.append(leftKey, rightKey);
          seventhButton.title = `${seventh.keyA}+${seventh.keyB} · ${seventh.label}`;
          seventhButton.setAttribute("aria-label", seventhButton.title);
          if (
            bassProfile.pressedSevenths.has(seventh.index) ||
            (bassProfile.seventhMode && bassProfile.pressedCodes.has(spec.code))
          ) seventhButton.classList.add("is-active");
          const seventhName = document.createElement("span");
          seventhName.className = "bass-chord-name bass-seventh-name";
          seventhName.textContent = seventh.label;
          wrap.append(seventhButton, seventhName);
        }
        const button = document.createElement("button");
        button.type = "button";
        button.className = "bass-button";
        button.dataset.bassCode = spec.code;
        const displayChord = bassDockChordForSpec(spec, diatonicSevenths);
        const specIntervals = displayChord.intervals;
        const tonePcs = displayChord.tonePcs;
        if (normalizedIntervals(specIntervals).length >= 4) button.classList.add("is-seventh");
        if (displayChord.isNinth) button.classList.add("is-ninth");
        button.style.setProperty("--bass-root-hue", String(hueForPitchClass(tonePcs.root)));
        button.style.setProperty("--bass-third-hue", String(hueForPitchClass(tonePcs.third)));
        button.style.setProperty("--bass-fifth-hue", String(hueForPitchClass(tonePcs.fifth)));
        button.style.setProperty("--bass-seventh-hue", String(hueForPitchClass(tonePcs.seventh)));
        if (tonePcs.ninth !== null) button.style.setProperty("--bass-ninth-hue", String(hueForPitchClass(tonePcs.ninth)));
        const buttonKey = document.createElement("span");
        buttonKey.className = "bass-button-key";
        buttonKey.textContent = spec.key;
        button.append(buttonKey);
        button.title = `${spec.key} · ${displayChord.label} · ${spec.roman}`;
        button.setAttribute("aria-label", button.title);
        if (bassProfile.pressedCodes.has(spec.code)) button.classList.add("is-active");
        const name = document.createElement("span");
        name.className = "bass-chord-name";
        name.textContent = displayChord.label;
        wrap.append(button, name);
        keysWrap.append(wrap);
      }
      fragment.append(leftHint, keysWrap, rightHint);
      els.bassDock.replaceChildren(fragment);
      els.bassDock.hidden = false;
    }

    function handleBassCodeDown(code) {
      if (!bassProfile.enabled) return false;
      if (isBassModifierCode(code)) {
        const wasSeventhActive = isBassSeventhActive();
        bassProfile.modifier = true;
        renderBassDock();
        updateBassVoicesForRecognition(wasSeventhActive);
        return true;
      }
      if (isBassSeventhCode(code)) {
        const wasSeventhActive = isBassSeventhActive();
        bassProfile.seventhMode = true;
        enforceSingleBassCodeForSeventhMode();
        renderBassDock();
        updateBassVoicesForRecognition(wasSeventhActive);
        return true;
      }
      if (!activeBassKeyCodes().has(code)) return false;
      if (!bassSpecByCode(code)) return true;
      if (bassProfile.seventhMode && bassProfile.pressedCodes.size > 0 && !bassProfile.pressedCodes.has(code)) return true;
      if (bassProfile.pressedCodes.size === 0) bassProfile.suppressedTriadCodes.clear();
      bassProfile.suppressedTriadCodes.delete(code);
      const wasSeventhActive = isBassSeventhActive();
      bassProfile.pressedCodes.add(code);
      enforceSingleBassCodeForSeventhMode();
      updateBassVoicesForRecognition(wasSeventhActive);
      return true;
    }

    function handleBassCodeUp(code) {
      if (!bassProfile.enabled) return false;
      if (isBassModifierCode(code)) {
        bassProfile.modifier = false;
        renderBassDock();
        updateBassVoices();
        return true;
      }
      if (isBassSeventhCode(code)) {
        bassProfile.seventhMode = false;
        renderBassDock();
        updateBassVoices();
        return true;
      }
      if (!activeBassKeyCodes().has(code)) return false;
      const wasTwoKeySeventh = bassProfile.pressedSevenths.size === 0
        && bassProfile.pressedCodes.size === 2
        && (currentBassChord()?.midis.length || 0) >= 4;
      bassProfile.pressedCodes.delete(code);
      if (wasTwoKeySeventh && bassProfile.pressedCodes.size === 1) {
        for (const remainingCode of bassProfile.pressedCodes) bassProfile.suppressedTriadCodes.add(remainingCode);
      }
      if (bassProfile.pressedCodes.size === 0) bassProfile.suppressedTriadCodes.clear();
      updateBassVoices();
      return true;
    }

    function coordForProfileCode(profile, code) {
      const position = codeToHardwarePosition.get(code);
      if (!position) return null;
      return {
        row: profile.anchor.row + position.rowDelta,
        col: profile.anchor.col + position.index
      };
    }

    function voicePrefixForProfileCode(profile, code) {
      return `${profile.source}-${profile.id}-${code}`;
    }

    function cancelPendingBrowserCode(code) {
      const pending = pendingBrowserStarts.get(code);
      if (!pending) return;
      window.clearTimeout(pending.timer);
      pendingBrowserStarts.delete(code);
    }

    function scheduleBrowserCodeStart(code, profile, coord) {
      cancelPendingBrowserCode(code);
      const timer = window.setTimeout(() => {
        pendingBrowserStarts.delete(code);
        if (!profileIsEnabled(profile)) return;
        if (shouldSuppressBrowserCode(code)) return;
        const source = sourceFromCoord(coord.row, coord.col);
        startVoice(source, `computer-${profile.id}-${code}`, 0, profile);
      }, 22);
      pendingBrowserStarts.set(code, { timer, profileId: profile.id });
    }

    function pressedCodesFromHidReport(dataView) {
      const bytes = Array.from({ length: dataView.byteLength }, (_, index) => dataView.getUint8(index));
      const bootUsages = bytes.length >= 8 ? bytes.slice(2, 8) : bytes;
      let codes = bootUsages
        .filter(usage => usage > 0)
        .map(usage => hidUsageToCode.get(usage))
        .filter(Boolean);

      if (bytes.length >= 8 && (bytes[0] & 0x02) !== 0) codes.push("ShiftLeft");
      if (bytes.length >= 8 && (bytes[0] & 0x20) !== 0) codes.push("ShiftRight");

      if (codes.length === 0 && bytes.length > 8) {
        codes = bytes
          .filter(usage => usage > 0)
          .map(usage => hidUsageToCode.get(usage))
          .filter(Boolean);
      }

      if (codes.length === 0 && bytes.length > 1) {
        const bitmapCodes = [];
        for (let byteIndex = 0; byteIndex < bytes.length; byteIndex += 1) {
          for (let bit = 0; bit < 8; bit += 1) {
            if ((bytes[byteIndex] & (1 << bit)) === 0) continue;
            const usage = byteIndex * 8 + bit;
            const code = hidUsageToCode.get(usage);
            if (code) bitmapCodes.push(code);
          }
        }
        codes = bitmapCodes;
      }

      return new Set(codes);
    }

    function suppressBrowserCodeOnce(code) {
      cancelPendingBrowserCode(code);
      hidSuppressedCodeUntil.set(code, performance.now() + 180);
      const profile = browserProfile();
      stopVoiceByPrefix(`computer-${profile.id}-${code}`);
    }

    function shouldSuppressBrowserCode(code) {
      const until = hidSuppressedCodeUntil.get(code) || 0;
      if (until <= performance.now()) {
        hidSuppressedCodeUntil.delete(code);
        return false;
      }
      return true;
    }

    function handleProfileCodeDown(profile, code) {
      if (bassClaimsBrowserCode(code)) {
        suppressBrowserCodeOnce(code);
        handleBassCodeDown(code);
        return;
      }
      if (!profileIsEnabled(profile)) return;
      if (isSustainCode(code)) {
        suppressBrowserCodeOnce(code);
        setSustainPedal(profile, true);
        return;
      }
      if (isSoftPedalCode(code)) {
        suppressBrowserCodeOnce(code);
        setSoftPedal(profile, true);
        return;
      }
      const coord = coordForProfileCode(profile, code);
      if (!coord) return;
      suppressBrowserCodeOnce(code);
      const source = sourceFromCoord(coord.row, coord.col);
      startVoice(source, voicePrefixForProfileCode(profile, code), 0, profile);
    }

    function handleProfileCodeUp(profile, code) {
      if (bassClaimsBrowserCode(code)) {
        suppressBrowserCodeOnce(code);
        handleBassCodeUp(code);
        return;
      }
      if (!profileIsEnabled(profile)) return;
      if (isSustainCode(code)) {
        suppressBrowserCodeOnce(code);
        setSustainPedal(profile, false);
        return;
      }
      if (isSoftPedalCode(code)) {
        suppressBrowserCodeOnce(code);
        setSoftPedal(profile, false);
        return;
      }
      suppressBrowserCodeOnce(code);
      releaseVoicePrefixForProfile(voicePrefixForProfileCode(profile, code), profile);
    }

    function releaseProfilePressedCodes(profile) {
      for (const code of profile.pressedCodes || []) {
        if (bassClaimsBrowserCode(code)) handleBassCodeUp(code);
        stopVoiceByPrefix(voicePrefixForProfileCode(profile, code));
      }
      setSustainPedal(profile, false);
      setSoftPedal(profile, false);
      releaseSustainedVoices(profile, 0.08);
      profile.pressedCodes = new Set();
    }

    function handleHidInputReport(profile, event) {
      const nextCodes = pressedCodesFromHidReport(event.data);
      const previousCodes = profile.pressedCodes || new Set();

      for (const code of nextCodes) {
        if (!previousCodes.has(code)) handleProfileCodeDown(profile, code);
      }

      for (const code of previousCodes) {
        if (!nextCodes.has(code)) handleProfileCodeUp(profile, code);
      }

      profile.pressedCodes = nextCodes;
    }

    function activateProfile(profile, { viewAnchor = null, keepScroll = true } = {}) {
      activeProfileId = profile.id;
      syncQAnchorFromActiveProfile();
      selectedCoord = { ...qAnchor };
      includeProfileHardwareRange(profile);
      renderMappingProfileOptions();
      syncProfileControls();
      renderKeyboard({ viewAnchor, keepScroll });
      updatePedalSwitches();
      updateReadoutForCoord(`${profile.short}:Q`, qAnchor.row, qAnchor.col);
    }

    async function requestHidDevice() {
      const attempts = [
        { filters: [] },
        { filters: [{ usagePage: 0x01, usage: 0x06 }] }
      ];
      let lastError = null;

      for (const options of attempts) {
        try {
          const devices = await navigator.hid.requestDevice(options);
          return devices[0] || null;
        } catch (error) {
          lastError = error;
          if (error.name !== "TypeError") throw error;
        }
      }

      throw lastError;
    }

    async function addHidKeyboard() {
      if (!("hid" in navigator)) {
        setReadout("HID", tr("hidUnsupported"));
        return;
      }

      try {
        const device = await requestHidDevice();
        if (!device) {
          setReadout("HID", tr("hidNoDevice"));
          return;
        }

        const existing = mappingProfiles.find(profile => profile.device === device);
        if (existing) {
          if (!device.opened) await device.open();
          activateProfile(existing);
          return;
        }

        if (!device.opened) await device.open();

        const hidIndex = mappingProfiles.filter(profile => profile.source === "hid").length + 1;
        const profile = {
          id: `hid-${Date.now()}-${hidIndex}`,
          label: device.productName || tr("hidKeyboardName", { index: hidIndex }),
          short: `H${hidIndex}`,
          anchor: { row: 1, col: 0 },
          instrument: activeProfile().instrument || "accordion",
          outputShift: 0,
          volume: profileVolume(activeProfile()),
          enabled: true,
          longVibrato: profileAllowsLongVibrato(activeProfile()),
          sustainEnabled: activeProfile().sustainEnabled !== false,
          sustainPedal: false,
          softPedal: false,
          source: "hid",
          device,
          pressedCodes: new Set()
        };

        profile.reportHandler = event => handleHidInputReport(profile, event);
        device.addEventListener("inputreport", profile.reportHandler);
        mappingProfiles.push(profile);
        activateProfile(profile);
      } catch (error) {
        const message = error.name === "NotAllowedError"
          ? tr("hidAddBlocked")
          : tr("hidAddFailed", { message: error.message || error });
        setReadout("HID", message);
      }
    }

    async function removeActiveKeyboard(profile = activeProfile()) {
      if (profile.id === "main") {
        setReadout(tr("mainKeyboard"), tr("mainCannotDelete"));
        return;
      }

      releaseProfilePressedCodes(profile);

      if (profile.device && profile.reportHandler) {
        profile.device.removeEventListener("inputreport", profile.reportHandler);
      }

      const wasActive = profile.id === activeProfileId;
      mappingProfiles = mappingProfiles.filter(item => item.id !== profile.id);
      if (wasActive) activeProfileId = "main";
      syncQAnchorFromActiveProfile();
      selectedCoord = { ...qAnchor };
      renderMappingProfileOptions();
      syncProfileControls();
      includeProfileHardwareRange();
      renderKeyboard();
      renderScaleStaff();
      updateReadoutForCoord(`${activeProfile().short}:Q`, qAnchor.row, qAnchor.col);

      if (profile.device?.opened) {
        try {
          await profile.device.close();
        } catch (error) {
          // The OS/browser may already have closed a disconnected HID device.
        }
      }
    }

    function updateReadoutForCoord(prefix, row, col) {
      const source = sourceFromCoord(row, col);
      const bend = manualBendCents ? ` · ${manualBendCents > 0 ? "+" : ""}${manualBendCents}c` : "";
      const profile = activeProfile();
      const shift = profile.outputShift ? ` · ${tr("outputPrefix")}${profile.outputShift > 0 ? "+" : ""}${profile.outputShift}` : "";
      els.currentNote.textContent = source.dataset.label;
      els.noteMeta.textContent = `${prefix} · ${source.dataset.hz} Hz · MIDI ${source.dataset.midi}${shift}${bend}`;
    }

    function selectButton(target) {
      selectedCoord = {
        row: Number(target.dataset.row),
        col: Number(target.dataset.col)
      };

      els.keyboard.querySelectorAll(".is-selected").forEach(key => key.classList.remove("is-selected"));
      target.classList.add("is-selected");
    }

    function updateAnchorState() {
      els.keyboard.querySelectorAll(".is-q-anchor").forEach(key => key.classList.remove("is-q-anchor"));
      const qButton = findButton(qAnchor.row, qAnchor.col);
      if (qButton) qButton.classList.add("is-q-anchor");
    }

    function captureViewAnchor() {
      const candidate =
        findButton(selectedCoord.row, selectedCoord.col) ||
        findButton(qAnchor.row, qAnchor.col) ||
        els.keyboard.querySelector(".key");

      if (!candidate) return null;
      const keyRect = candidate.getBoundingClientRect();
      const scrollRect = els.keyboardScroll.getBoundingClientRect();

      return {
        row: Number(candidate.dataset.row),
        col: Number(candidate.dataset.col),
        x: keyRect.left - scrollRect.left,
        y: keyRect.top - scrollRect.top
      };
    }

    function restoreViewAnchor(anchor) {
      if (!anchor) return;
      const candidate = findButton(anchor.row, anchor.col);
      if (!candidate) return;

      const keyRect = candidate.getBoundingClientRect();
      const scrollRect = els.keyboardScroll.getBoundingClientRect();
      els.keyboardScroll.scrollLeft += keyRect.left - scrollRect.left - anchor.x;
      els.keyboardScroll.scrollTop += keyRect.top - scrollRect.top - anchor.y;
    }

    function renderKeyboard({ keepScroll = true, viewAnchor = null } = {}) {
      stopAllVoices();
      buildHardwareMap();
      const keyShape = els.keyShape.value === "round" ? "round" : "hex";
      els.keyboard.classList.toggle("shape-hex", keyShape === "hex");
      els.keyboard.classList.toggle("shape-round", keyShape === "round");

      const previousLeft = els.keyboardScroll.scrollLeft;
      const previousTop = els.keyboardScroll.scrollTop;
      const { low, high, upper, lower } = sanitizeRange();
      const fragment = document.createDocumentFragment();
      const firstRow = -upper;
      const lastRow = ROW_COUNT - 1 + lower;
      const system = currentSystem();
      const spellingByPc = activeScaleSpellingByPc();
      const assistToneLevels = selectedAssistToneLevels();

      for (let row = firstRow; row <= lastRow; row += 1) {
        const rowEl = document.createElement("div");
        rowEl.className = "button-row";

        const rowLabel = document.createElement("span");
        rowLabel.className = "row-label";
        rowLabel.textContent = rowName(row);
        rowEl.append(rowLabel);

        const rowKeys = document.createElement("div");
        rowKeys.className = "row-keys";
        const rowIndex = rowIndentForSystem(system, row, firstRow, lastRow);
        rowKeys.style.setProperty("--indent", rowIndex);
        const rowRange = displayRangeForRow(row, low, high);
        rowKeys.style.setProperty("--range-offset", rowRange.low - low);

        for (let col = rowRange.low; col <= rowRange.high; col += 1) {
          const midi = buttonMidi(row, col);
          const info = midiToInfo(midi);
          const display = displayNoteForMidi(midi, info, spellingByPc);
          const key = document.createElement("button");
          const hardwareLabels = coordToLabels.get(coordKey(row, col));
          const reservedLabels = coordToReservedLabels.get(coordKey(row, col)) || [];

          key.type = "button";
          key.className = "key";
          if (spellingByPc) {
            key.classList.add(display.inScale ? "is-scale-tone" : "is-out-scale");
            key.classList.add(`is-tone-${assistToneForDisplay(display, assistToneLevels)}`);
          }
          key.style.setProperty("--hue", String(info.hue));
          key.dataset.midi = String(midi);
          key.dataset.label = display.label;
          key.dataset.hz = info.hz.toFixed(2);
          key.dataset.col = String(col);
          key.dataset.row = String(row);
          key.title = `${display.label} · ${info.hz.toFixed(2)} Hz · MIDI ${midi} · ${tr("circleTitle", { index: info.fifthIndex + 1 })}`;
          key.setAttribute("aria-label", key.title);
          key.innerHTML = `<span class="note">${display.note}</span><span class="octave">${display.octave}</span>`;

          if (hardwareLabels) {
            const map = document.createElement("span");
            map.className = "key-map";
            if (hardwareLabels.some(label => reservedLabels.includes(label))) map.classList.add("is-bass-reserved");
            map.textContent = hardwareLabels.join("/");
            key.append(map);
          }

          if (sameCoord(selectedCoord, { row, col })) key.classList.add("is-selected");
          rowKeys.append(key);
        }

        rowEl.append(rowKeys);
        fragment.append(rowEl);
      }

      els.keyboard.replaceChildren(fragment);
      updateAnchorState();
      renderScaleStaff();
      renderBassDock();

      requestAnimationFrame(() => {
        if (viewAnchor) {
          restoreViewAnchor(viewAnchor);
        } else if (keepScroll) {
          els.keyboardScroll.scrollLeft = previousLeft;
          els.keyboardScroll.scrollTop = previousTop;
        } else {
          centerKeyboard();
        }
      });
    }

    function scheduleRender() {
      window.clearTimeout(renderTimer);
      const viewAnchor = captureViewAnchor();
      renderTimer = window.setTimeout(() => renderKeyboard({ viewAnchor }), 50);
    }

    function shiftKeyboardColor(step) {
      cColorIndex = mod(cColorIndex + step, 12);
      const viewAnchor = captureViewAnchor();
      updateColorControl();
      renderKeyboard({ viewAnchor });
      renderBassDock();
      updateReadoutForCoord(`${activeProfile().short}:Q`, qAnchor.row, qAnchor.col);
    }

    function centerKeyboard() {
      const scroller = els.keyboardScroll;
      scroller.scrollLeft = Math.max(0, (scroller.scrollWidth - scroller.clientWidth) / 2);
      scroller.scrollTop = Math.max(0, (scroller.scrollHeight - scroller.clientHeight) / 2);
    }

    function resetVisibleRangeAndQ() {
      els.lowCol.value = DEFAULT_VISIBLE_RANGE.lowCol;
      els.highCol.value = DEFAULT_VISIBLE_RANGE.highCol;
      els.upperRows.value = DEFAULT_VISIBLE_RANGE.upperRows;
      els.lowerRows.value = DEFAULT_VISIBLE_RANGE.lowerRows;
      setActiveAnchor(DEFAULT_Q_ANCHOR);
      selectedCoord = { ...qAnchor };
      renderMappingProfileOptions();
      renderKeyboard({ keepScroll: false });
      updateReadoutForCoord(`${activeProfile().short}:Q`, qAnchor.row, qAnchor.col);
    }

    function ensureAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function createNoiseSource(context, duration = 2) {
      const length = Math.max(1, Math.floor(context.sampleRate * duration));
      const buffer = context.createBuffer(1, length, context.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i += 1) data[i] = Math.random() * 2 - 1;
      const source = context.createBufferSource();
      source.buffer = buffer;
      source.loop = true;
      return source;
    }

    function playMetronomeClick(accent = false) {
      const context = ensureAudio();
      const now = context.currentTime;
      const osc = context.createOscillator();
      const gain = context.createGain();

      osc.type = "square";
      osc.frequency.setValueAtTime(accent ? 1280 : 860, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(accent ? 0.18 : 0.12, now + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.055);
      osc.connect(gain);
      gain.connect(context.destination);
      osc.start(now);
      osc.stop(now + 0.07);
    }

    function runMetronomeTick() {
      if (!metronomeActive) return;
      playMetronomeClick(metronomeBeat % 4 === 0);
      metronomeBeat += 1;
      metronomeTimerId = window.setTimeout(runMetronomeTick, metronomeIntervalMs());
    }

    function startMetronome() {
      if (metronomeActive) return;
      try {
        ensureAudio();
      } catch (error) {
        setReadout(tr("audioLabel"), tr("audioError"));
        return;
      }
      metronomeActive = true;
      metronomeBeat = 0;
      updateMetronomeDisplay();
      setReadout(tr("metronome"), `${metronomeBpm} BPM`);
      runMetronomeTick();
    }

    function stopMetronome() {
      if (!metronomeActive) return;
      metronomeActive = false;
      if (metronomeTimerId) window.clearTimeout(metronomeTimerId);
      metronomeTimerId = null;
      updateMetronomeDisplay();
      setReadout(tr("metronome"), tr("metronomeOff"));
    }

    function adjustMetronome(delta) {
      metronomeBpm = clampNumber(metronomeBpm + delta, DEFAULT_METRONOME_BPM, MIN_METRONOME_BPM, MAX_METRONOME_BPM);
      updateMetronomeDisplay();
      if (!metronomeActive) return;
      if (metronomeTimerId) window.clearTimeout(metronomeTimerId);
      metronomeTimerId = window.setTimeout(runMetronomeTick, metronomeIntervalMs());
      setReadout(tr("metronome"), `${metronomeBpm} BPM`);
    }

    function applyPitchToVoice(voice) {
      if (!audioContext) return;
      const now = audioContext.currentTime;
      for (const item of voice.oscillators) {
        item.osc.detune.setTargetAtTime(item.baseDetune + manualBendCents, now, 0.012);
      }
    }

    function setManualBend(cents) {
      manualBendCents = Math.max(-80, Math.min(80, Math.round(cents)));
      const percent = 50 + manualBendCents / 160 * 100;
      els.vibratoPad.style.setProperty("--bend-x", `${percent}%`);
      els.vibratoLabel.textContent = `${manualBendCents > 0 ? "+" : ""}${manualBendCents}c`;

      for (const voice of voices.values()) applyPitchToVoice(voice);
      if (voices.size === 0) updateReadoutForCoord(`${activeProfile().short}:Q`, qAnchor.row, qAnchor.col);
    }

    function vibratoSensitivity() {
      const value = Number(els.vibratoSensitivity.value);
      return Number.isFinite(value) ? Math.max(0.1, Math.min(1, value)) : 1;
    }

    function presetFilterFrequency(filterSpec, baseHz) {
      if (!filterSpec) return 3200;
      const track = Number(filterSpec.track);
      const offset = Number(filterSpec.offset) || 0;
      const fixed = Number(filterSpec.frequency);
      const raw = Number.isFinite(track) ? baseHz * track + offset : fixed;
      const fallback = Number.isFinite(fixed) ? fixed : 3200;
      const min = Number.isFinite(Number(filterSpec.min)) ? Number(filterSpec.min) : 40;
      const max = Number.isFinite(Number(filterSpec.max)) ? Number(filterSpec.max) : 12000;
      return Math.min(max, Math.max(min, Number.isFinite(raw) ? raw : fallback));
    }

    function periodicWaveFromHarmonics(context, harmonics) {
      const safeHarmonics = Array.isArray(harmonics) && harmonics.length ? harmonics : [1];
      const real = new Float32Array(safeHarmonics.length + 1);
      const imag = new Float32Array(safeHarmonics.length + 1);
      for (let index = 0; index < safeHarmonics.length; index += 1) {
        imag[index + 1] = Number(safeHarmonics[index]) || 0;
      }
      return context.createPeriodicWave(real, imag, { disableNormalization: false });
    }

    function voiceKey(target, voiceId = "single") {
      return `${voiceId}:${target.dataset.row}:${target.dataset.col}:${target.dataset.midi}`;
    }

    function showNote(target, profile = activeProfile()) {
      const bend = manualBendCents ? ` · ${manualBendCents > 0 ? "+" : ""}${manualBendCents}c` : "";
      const shift = profile.outputShift ? ` · ${tr("outputPrefix")}${profile.outputShift > 0 ? "+" : ""}${profile.outputShift}` : "";
      els.currentNote.textContent = target.dataset.label;
      els.noteMeta.textContent = `${profile.short} · ${target.dataset.hz} Hz · MIDI ${target.dataset.midi}${shift}${bend}`;
    }

    function startVoice(target, voiceId = "single", autoStopMs = 0, profile = activeProfile()) {
      if (!profileIsEnabled(profile)) return;
      const context = ensureAudio();
      const id = voiceKey(target, voiceId);
      const existingVoice = voices.get(id);
      if (existingVoice) {
        if (existingVoice.sustained) {
          stopVoice(id, 0.03);
        } else {
          return;
        }
      }

      const preset = instruments[profile.instrument] || instruments.accordion;
      const now = context.currentTime;
      const outputShift = Number(profile.outputShift) || 0;
      const baseHz = Number(target.dataset.hz) * Math.pow(2, outputShift / 12);
      const output = context.createGain();
      const profileGain = context.createGain();
      const envelope = preset.envelope;
      const presetLevel = clampFloat(preset.level, 1, 0.35, 2.2);
      const peakGain = Math.max(0.0001, FIXED_OUTPUT_VOLUME * 0.42 * presetLevel);

      profileGain.gain.setValueAtTime(profileOutputGain(profile), now);
      output.gain.setValueAtTime(0.0001, now);
      output.gain.exponentialRampToValueAtTime(peakGain, now + envelope.attack);
      output.gain.exponentialRampToValueAtTime(Math.max(0.0001, peakGain * envelope.sustain), now + envelope.attack + envelope.decay);

      let destination = output;
      const destinations = [];
      if (preset.filter) {
        const filter = context.createBiquadFilter();
        filter.type = preset.filter.type;
        filter.frequency.setValueAtTime(presetFilterFrequency(preset.filter, baseHz), now);
        filter.Q.setValueAtTime(preset.filter.q, now);
        filter.connect(output);
        destination = filter;
      }
      destinations.push(destination);

      if (preset.formants) {
        for (const formantSpec of preset.formants) {
          const formant = context.createBiquadFilter();
          const formantGain = context.createGain();
          formant.type = "bandpass";
          formant.frequency.setValueAtTime(presetFilterFrequency(formantSpec, baseHz), now);
          formant.Q.setValueAtTime(formantSpec.q || 1.2, now);
          formantGain.gain.setValueAtTime(formantSpec.gain || 0.1, now);
          formant.connect(formantGain);
          formantGain.connect(output);
          destinations.push(formant);
        }
      }

      output.connect(profileGain);
      profileGain.connect(context.destination);

      const voice = {
        target,
        output,
        profileGain,
        oscillators: [],
        sources: [],
        release: envelope.release,
        startTime: now,
        attack: envelope.attack,
        decay: envelope.decay,
        peakGain,
        sustainGain: Math.max(0.0001, peakGain * envelope.sustain),
        releaseTimer: null,
        profile,
        sustained: false,
        sustainProfile: null
      };

      for (const spec of preset.oscillators || []) {
        const osc = context.createOscillator();
        const gain = context.createGain();
        if (spec.harmonics) {
          osc.setPeriodicWave(periodicWaveFromHarmonics(context, spec.harmonics));
        } else {
          osc.type = spec.type;
        }
        osc.frequency.setValueAtTime(baseHz * spec.ratio, now);
        osc.detune.setValueAtTime((spec.detune || 0) + manualBendCents, now);
        gain.gain.setValueAtTime(spec.gain, now);
        osc.connect(gain);
        for (const targetDestination of destinations) gain.connect(targetDestination);
        osc.start(now);
        voice.oscillators.push({ osc, baseDetune: spec.detune || 0 });
        voice.sources.push(osc);
      }

      for (const spec of preset.partials || []) {
        const osc = context.createOscillator();
        const gain = context.createGain();
        const partialAttack = Math.max(0.001, spec.attack ?? envelope.attack);
        const partialDecay = Math.max(0.001, spec.decay ?? envelope.decay);
        const partialGain = Math.max(0.0001, spec.gain || 0.1);
        const partialSustain = Math.max(0.0001, partialGain * (spec.sustain ?? 0.02));

        osc.type = spec.type || "sine";
        osc.frequency.setValueAtTime(baseHz * (spec.ratio || 1), now);
        osc.detune.setValueAtTime((spec.detune || 0) + manualBendCents, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(partialGain, now + partialAttack);
        gain.gain.exponentialRampToValueAtTime(partialSustain, now + partialAttack + partialDecay);
        osc.connect(gain);
        for (const targetDestination of destinations) gain.connect(targetDestination);
        osc.start(now);
        voice.oscillators.push({ osc, baseDetune: spec.detune || 0 });
        voice.sources.push(osc);
      }

      if (preset.noise) {
        const noise = createNoiseSource(context);
        const noiseGain = context.createGain();
        const noiseFilter = context.createBiquadFilter();
        noiseFilter.type = preset.noise.type;
        noiseFilter.frequency.setValueAtTime(preset.noise.frequency, now);
        if (preset.noise.decay) {
          const noiseAttack = Math.max(0.001, preset.noise.attack || 0.001);
          const noiseDecay = Math.max(0.001, preset.noise.decay);
          noiseGain.gain.setValueAtTime(0.0001, now);
          noiseGain.gain.exponentialRampToValueAtTime(preset.noise.gain, now + noiseAttack);
          noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + noiseAttack + noiseDecay);
          try {
            noise.stop(now + noiseAttack + noiseDecay + 0.04);
          } catch (error) {
            // Noise transient may already be scheduled by release handling.
          }
        } else {
          noiseGain.gain.setValueAtTime(preset.noise.gain, now);
        }
        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(destination);
        noise.start(now);
        voice.sources.push(noise);
      }

      if (preset.vibrato) {
        const lfo = context.createOscillator();
        const lfoGain = context.createGain();
        lfo.type = "sine";
        lfo.frequency.setValueAtTime(preset.vibrato.rate, now);
        lfoGain.gain.setValueAtTime(preset.vibrato.depth, now);
        lfo.connect(lfoGain);
        for (const item of voice.oscillators) lfoGain.connect(item.osc.detune);
        lfo.start(now);
        voice.sources.push(lfo);
      }

      voices.set(id, voice);
      if (autoStopMs <= 0) beginLongVibratoHold(id, profile);
      target.classList.add("is-active");
      showNote(target, profile);

      if (autoStopMs > 0) {
        window.setTimeout(() => stopVoice(id), autoStopMs);
      }
    }

    function voiceEnvelopeGainAt(voice, now) {
      if (voice.releasing && Number.isFinite(voice.releaseStartTime) && Number.isFinite(voice.releaseEndTime)) {
        const duration = Math.max(0.001, voice.releaseEndTime - voice.releaseStartTime);
        const progress = Math.min(1, Math.max(0, (now - voice.releaseStartTime) / duration));
        const startGain = Math.max(0.0001, voice.releaseStartGain || 0.0001);
        return Math.max(0.0001, startGain * Math.pow(0.0001 / startGain, progress));
      }

      const startTime = Number.isFinite(voice.startTime) ? voice.startTime : now;
      const elapsed = Math.max(0, now - startTime);
      const attack = Math.max(0.001, voice.attack || 0.001);
      const decay = Math.max(0.001, voice.decay || 0.001);
      const peak = Math.max(0.0001, voice.peakGain || 0.0001);
      const sustain = Math.max(0.0001, voice.sustainGain || peak);

      if (elapsed < attack) {
        return Math.max(0.0001, peak * Math.max(0.04, elapsed / attack));
      }
      if (elapsed < attack + decay) {
        const t = (elapsed - attack) / decay;
        return Math.max(0.0001, peak * Math.pow(sustain / peak, t));
      }
      return sustain;
    }

    function updateKeyActiveState(target) {
      const stillActive = [...voices.values()].some(active => active.target === target && !active.releasing);
      if (!stillActive) target.classList.remove("is-active");
    }

    function finalizeVoice(id, voice) {
      if (voices.get(id) !== voice) return;
      voices.delete(id);
      voice.sustained = false;
      voice.sustainProfile = null;
      voice.releasing = false;
      voice.releaseTimer = null;
      endLongVibratoHold(id);
      updateKeyActiveState(voice.target);
    }

    function stopVoice(id, releaseOverride = null, options = {}) {
      const voice = voices.get(id);
      if (!voice || !audioContext) return;

      const now = audioContext.currentTime;
      const release = Math.max(0.03, releaseOverride ?? voice.release ?? 0.2);
      const releaseStartGain = voiceEnvelopeGainAt(voice, now);
      if (voice.releaseTimer) {
        window.clearTimeout(voice.releaseTimer);
        voice.releaseTimer = null;
      }
      voice.output.gain.cancelScheduledValues(now);
      voice.output.gain.setValueAtTime(releaseStartGain, now);
      voice.output.gain.exponentialRampToValueAtTime(0.0001, now + release);
      voice.releasing = true;
      voice.releaseStartTime = now;
      voice.releaseEndTime = now + release;
      voice.releaseStartGain = releaseStartGain;

      for (const source of voice.sources) {
        try {
          source.stop(now + release + 0.04);
        } catch (error) {
          // Some Web Audio sources can be stopped only once.
        }
      }

      endLongVibratoHold(id);

      if (options.keepTracked) {
        voice.sustained = Boolean(options.sustained);
        voice.sustainProfile = options.sustainProfile || voice.sustainProfile;
        voice.releaseTimer = window.setTimeout(() => finalizeVoice(id, voice), release * 1000 + 80);
        updateKeyActiveState(voice.target);
        return;
      }

      finalizeVoice(id, voice);
    }

    function stopVoiceByPrefix(prefix, releaseOverride = null) {
      for (const id of [...voices.keys()]) {
        if (id.startsWith(`${prefix}:`)) stopVoice(id, releaseOverride);
      }
    }

    function sustainVoice(id, profile) {
      const voice = voices.get(id);
      if (!voice) return;
      voice.sustained = true;
      voice.sustainProfile = profile;
      endLongVibratoHold(id);
      stopVoice(id, globalSustainTime(), { keepTracked: true, sustained: true, sustainProfile: profile });
    }

    function sustainVoiceByPrefix(prefix, profile) {
      for (const id of [...voices.keys()]) {
        if (id.startsWith(`${prefix}:`)) sustainVoice(id, profile);
      }
    }

    function releaseSustainedVoices(profile, releaseTime = pedalFadeTime()) {
      for (const [id, voice] of [...voices.entries()]) {
        if (voice.sustained && voice.sustainProfile === profile) stopVoice(id, releaseTime);
      }
    }

    function anySustainPedalActive() {
      return mappingProfiles.some(profile => profile.sustainEnabled !== false && profile.sustainPedal);
    }

    function setSustainPedal(profile, active) {
      if (!profile || profile.source === "pointer") return;
      if (profile.sustainEnabled === false) {
        profile.sustainPedal = false;
        releaseSustainedVoices(profile, 0.08);
        updatePedalSwitches();
        return;
      }
      if (Boolean(profile.sustainPedal) === Boolean(active)) return;
      profile.sustainPedal = Boolean(active);
      updatePedalSwitches();

      if (profile.sustainPedal) {
        setReadout(tr("sustainPedal"), tr("sustainPedalOn"));
        return;
      }

      const releaseTime = pedalFadeTime();
      releaseSustainedVoices(profile, releaseTime);
      if (!anySustainPedalActive()) releaseSustainedVoices(pointerProfile, releaseTime);
      setReadout(tr("sustainPedal"), tr("sustainPedalOff", { time: formatSeconds(releaseTime) }));
    }

    function setSoftPedal(profile, active) {
      if (!profile || profile.source === "pointer") return;
      if (Boolean(profile.softPedal) === Boolean(active)) return;
      profile.softPedal = Boolean(active);
      applyProfileOutputGain(profile);
      updatePedalSwitches();
      setReadout(tr("softPedal"), tr(profile.softPedal ? "softPedalOn" : "softPedalOff"));
    }

    function releaseVoicePrefixForProfile(prefix, profile) {
      if (profile?.sustainEnabled !== false && profile?.sustainPedal) {
        sustainVoiceByPrefix(prefix, profile);
        return;
      }
      stopVoiceByPrefix(prefix);
    }

    function releasePointerVoicePrefix(prefix) {
      if (pointerProfile.followSustainPedal) {
        if (anySustainPedalActive()) {
          sustainVoiceByPrefix(prefix, pointerProfile);
          return;
        }
        stopVoiceByPrefix(prefix);
        return;
      }
      stopVoiceByPrefix(prefix, pointerFadeTime());
    }

    function stopPointerVoices() {
      for (const id of [...voices.keys()]) {
        if (id.startsWith("pointer-") || id.startsWith("click:")) stopVoice(id);
      }
    }

    function clearGlissandoStates() {
      for (const state of pointerGlissandoStates.values()) clearGlissandoTimer(state);
      pointerGlissandoStates.clear();
    }

    function stopAllVoices() {
      for (const [code, pending] of pendingBrowserStarts) {
        window.clearTimeout(pending.timer);
        pendingBrowserStarts.delete(code);
      }
      clearGlissandoStates();
      for (const id of [...voices.keys()]) stopVoice(id);
      for (const profile of mappingProfiles) {
        profile.sustainPedal = false;
        profile.softPedal = false;
      }
      bassProfile.pressedCodes.clear();
      bassProfile.activePointerCodes.clear();
      bassProfile.modifier = false;
      bassProfile.seventhMode = false;
      bassProfile.pressedSevenths.clear();
      bassProfile.activePointerSevenths.clear();
      bassProfile.suppressedTriadCodes.clear();
      els.keyboard.querySelectorAll(".is-active").forEach(key => key.classList.remove("is-active"));
      els.bassDock.querySelectorAll(".bass-button.is-active, .bass-seventh-button.is-active").forEach(button => button.classList.remove("is-active"));
      clearLongVibrato();
      updatePedalSwitches();
    }

    function findIntervalCoord(deltaSemitones) {
      const targetMidi = buttonMidi(qAnchor.row, qAnchor.col) + deltaSemitones;
      let best = null;

      for (let row = qAnchor.row - 6; row <= qAnchor.row + 6; row += 1) {
        for (let col = qAnchor.col - 10; col <= qAnchor.col + 10; col += 1) {
          if (buttonMidi(row, col) !== targetMidi) continue;
          const score = Math.abs(row - qAnchor.row) * 4 + Math.abs(col - qAnchor.col);
          if (!best || score < best.score) best = { row, col, score };
        }
      }

      return best ? { row: best.row, col: best.col } : null;
    }

    function moveQBy(deltaSemitones, prefix) {
      const viewAnchor = captureViewAnchor();
      const system = currentSystem();
      const next =
        Math.abs(deltaSemitones) === 12 && system.octaveColStep !== null
          ? { row: qAnchor.row, col: qAnchor.col + system.octaveColStep * Math.sign(deltaSemitones) }
          : findIntervalCoord(deltaSemitones);

      if (!next) return;

      setActiveAnchor(next);
      selectedCoord = { ...next };
      includeProfileHardwareRange();
      renderKeyboard({ viewAnchor });
      updateReadoutForCoord(prefix, qAnchor.row, qAnchor.col);
    }

    function moveQToCoord(coord, prefix) {
      const viewAnchor = captureViewAnchor();
      setActiveAnchor(coord);
      selectedCoord = { ...coord };
      includeProfileHardwareRange();
      renderKeyboard({ viewAnchor });
      updateReadoutForCoord(prefix, qAnchor.row, qAnchor.col);
    }

    function isTypingTarget(target) {
      const tag = target?.tagName;
      return target?.isContentEditable || tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA";
    }

    function updateBendFromPointer(event) {
      const rect = els.vibratoPad.getBoundingClientRect();
      const normalized = (event.clientX - rect.left) / rect.width;
      setManualBend((normalized - 0.5) * 160 * vibratoSensitivity());
    }

    function runAutoVibrato(timestamp) {
      const hold = longVibratoState ? longVibratoHolds.get(longVibratoState.holdId) : null;
      if (!longVibratoState?.active || !hold || !profileAllowsLongVibrato(hold.profile)) {
        longVibratoState = null;
        setManualBend(0);
        return;
      }
      if (!longVibratoState.startedAt) longVibratoState.startedAt = timestamp;
      const elapsedSeconds = (timestamp - longVibratoState.startedAt) / 1000;
      const depthCents = 16;
      const rateHz = 5.6;
      setManualBend(Math.sin(elapsedSeconds * Math.PI * 2 * rateHz) * depthCents);
      autoVibratoFrame = requestAnimationFrame(runAutoVibrato);
    }

    function activateLongVibratoHold(holdId) {
      const hold = longVibratoHolds.get(holdId);
      if (!hold || !profileAllowsLongVibrato(hold.profile)) return;
      longVibratoState = { holdId, active: true, startedAt: 0 };
      cancelAnimationFrame(autoVibratoFrame);
      autoVibratoFrame = requestAnimationFrame(runAutoVibrato);
    }

    function beginLongVibratoHold(holdId, profile) {
      if (!profileAllowsLongVibrato(profile) || longVibratoHolds.has(holdId)) return;
      const timer = window.setTimeout(() => activateLongVibratoHold(holdId), 260);
      longVibratoHolds.set(holdId, { timer, profile });
    }

    function endLongVibratoHold(holdId) {
      const hold = longVibratoHolds.get(holdId);
      if (hold) window.clearTimeout(hold.timer);
      longVibratoHolds.delete(holdId);

      if (longVibratoState?.holdId !== holdId) return;
      const nextHoldId = [...longVibratoHolds.entries()]
        .find(([, nextHold]) => profileAllowsLongVibrato(nextHold.profile))?.[0];
      if (nextHoldId) {
        activateLongVibratoHold(nextHoldId);
        return;
      }

      longVibratoState = null;
      cancelAnimationFrame(autoVibratoFrame);
      setManualBend(0);
    }

    function clearLongVibrato() {
      for (const hold of longVibratoHolds.values()) window.clearTimeout(hold.timer);
      longVibratoHolds.clear();
      longVibratoState = null;
      cancelAnimationFrame(autoVibratoFrame);
      setManualBend(0);
    }

    function clearLongVibratoForProfile(profile) {
      let removedActiveHold = false;
      for (const [holdId, hold] of [...longVibratoHolds.entries()]) {
        if (hold.profile !== profile) continue;
        window.clearTimeout(hold.timer);
        longVibratoHolds.delete(holdId);
        if (longVibratoState?.holdId === holdId) removedActiveHold = true;
      }

      if (!removedActiveHold) return;
      const nextHoldId = [...longVibratoHolds.entries()]
        .find(([, nextHold]) => profileAllowsLongVibrato(nextHold.profile))?.[0];
      if (nextHoldId) {
        activateLongVibratoHold(nextHoldId);
        return;
      }

      longVibratoState = null;
      cancelAnimationFrame(autoVibratoFrame);
      setManualBend(0);
    }

    function keyIdentity(target) {
      return `${target.dataset.row}:${target.dataset.col}:${target.dataset.midi}`;
    }

    function keyFromPointerEvent(event) {
      const element = document.elementFromPoint(event.clientX, event.clientY);
      const target = element?.closest?.(".key");
      return target && els.keyboard.contains(target) ? target : null;
    }

    function clearGlissandoTimer(state) {
      if (!state?.timer) return;
      window.clearTimeout(state.timer);
      state.timer = null;
    }

    function playGlissandoTarget(state, target) {
      const identity = keyIdentity(target);
      if (identity === state.currentIdentity) return;
      state.currentIdentity = identity;
      state.pendingIdentity = identity;
      selectButton(target);
      releasePointerVoicePrefix(`pointer-${state.pointerId}`);
      startVoice(target, `pointer-${state.pointerId}`, 0, pointerProfile);
    }

    function scheduleGlissandoTarget(state, target) {
      const identity = keyIdentity(target);
      if (state.pendingIdentity === identity) return;
      clearGlissandoTimer(state);
      state.pendingIdentity = identity;
      state.timer = window.setTimeout(() => {
        state.timer = null;
        playGlissandoTarget(state, target);
      }, glissandoDwellMs());
    }

    function endGlissando(pointerId) {
      const state = pointerGlissandoStates.get(pointerId);
      if (state) clearGlissandoTimer(state);
      pointerGlissandoStates.delete(pointerId);
      releasePointerVoicePrefix(`pointer-${pointerId}`);
    }

    els.keyboard.addEventListener("pointerdown", event => {
      const target = event.target.closest(".key");
      if (!target) return;
      event.preventDefault();
      ignoreNextClickUntil = performance.now() + 300;
      selectButton(target);
      if (!profileIsEnabled(pointerProfile)) return;

      target.setPointerCapture?.(event.pointerId);
      stopPointerVoices();
      startVoice(target, `pointer-${event.pointerId}`, 0, pointerProfile);
      pointerGlissandoStates.set(event.pointerId, {
        pointerId: event.pointerId,
        currentIdentity: keyIdentity(target),
        pendingIdentity: keyIdentity(target),
        timer: null
      });
    });

    els.keyboard.addEventListener("pointermove", event => {
      const state = pointerGlissandoStates.get(event.pointerId);
      if (!state) return;
      event.preventDefault();
      const target = keyFromPointerEvent(event);
      if (!target) {
        clearGlissandoTimer(state);
        state.pendingIdentity = "";
        return;
      }
      const identity = keyIdentity(target);
      if (identity === state.currentIdentity) {
        clearGlissandoTimer(state);
        state.pendingIdentity = identity;
        return;
      }
      scheduleGlissandoTarget(state, target);
    });

    els.keyboard.addEventListener("pointerup", event => {
      endGlissando(event.pointerId);
    });

    els.keyboard.addEventListener("pointercancel", event => {
      endGlissando(event.pointerId);
    });

    els.keyboard.addEventListener("click", event => {
      const target = event.target.closest(".key");
      if (!target) return;
      if (performance.now() < ignoreNextClickUntil) return;
      selectButton(target);
      if (!profileIsEnabled(pointerProfile)) return;
      stopPointerVoices();
      startVoice(target, "click", 0, pointerProfile);
      window.setTimeout(() => releasePointerVoicePrefix("click"), 140);
    });

    document.addEventListener("pointerdown", event => {
      clearFocusedControl(event);
      primeAudioFromGesture(event);
    }, { capture: true });

    window.addEventListener("keydown", event => {
      if (shouldSuppressBrowserCode(event.code)) {
        event.preventDefault();
        return;
      }
      const profile = browserProfile();
      if (profileIsEnabled(profile) && isSustainEvent(event)) {
        event.preventDefault();
        if (!event.repeat) setSustainPedal(profile, true);
        return;
      }
      if (profileIsEnabled(profile) && isSoftPedalEvent(event)) {
        event.preventDefault();
        if (!event.repeat) setSoftPedal(profile, true);
        return;
      }
      if (isTypingTarget(event.target)) return;
      if (event.ctrlKey || event.metaKey || event.altKey) return;

      const arrowMap = {
        ArrowUp: () => moveQToCoord({ row: qAnchor.row - 1, col: qAnchor.col }, "Q 左上"),
        ArrowDown: () => moveQToCoord({ row: qAnchor.row + 1, col: qAnchor.col }, "Q 右下"),
        ArrowRight: () => moveQBy(12, "Q +8"),
        ArrowLeft: () => moveQBy(-12, "Q -8")
      };

      if (arrowMap[event.key]) {
        event.preventDefault();
        arrowMap[event.key]();
        return;
      }

      if (bassClaimsBrowserCode(event.code)) {
        event.preventDefault();
        if (!event.repeat) handleBassCodeDown(event.code);
        return;
      }
      if (event.repeat) return;
      if (!profileIsEnabled(profile)) return;
      const coord = coordForProfileCode(profile, event.code);
      if (!coord) return;

      event.preventDefault();
      scheduleBrowserCodeStart(event.code, profile, coord);
    });

    window.addEventListener("keyup", event => {
      if (shouldSuppressBrowserCode(event.code)) {
        event.preventDefault();
        return;
      }
      const profile = browserProfile();
      if (profileIsEnabled(profile) && isSustainEvent(event)) {
        event.preventDefault();
        setSustainPedal(profile, false);
        return;
      }
      if (profileIsEnabled(profile) && isSoftPedalEvent(event)) {
        event.preventDefault();
        setSoftPedal(profile, false);
        return;
      }
      if (isTypingTarget(event.target)) return;
      if (handleBassCodeUp(event.code)) {
        event.preventDefault();
        return;
      }
      if (profileIsEnabled(profile) && coordForProfileCode(profile, event.code)) {
        event.preventDefault();
        cancelPendingBrowserCode(event.code);
        releaseVoicePrefixForProfile(`computer-${profile.id}-${event.code}`, profile);
      }
    });

    els.centerView.addEventListener("click", centerKeyboard);

    els.languageSelect.addEventListener("change", event => {
      releaseControlFocus(event);
      currentLanguage = supportedLanguages.has(event.target.value) ? event.target.value : "zh";
      try {
        localStorage.setItem("qboard-language", currentLanguage);
      } catch (error) {
        // Language still changes for this session if storage is unavailable.
      }
      const viewAnchor = captureViewAnchor();
      applyTranslations();
      renderMappingProfileOptions();
      renderKeyboard({ viewAnchor });
      renderScaleStaff();
      renderBassDock();
      updateReadoutForCoord(`${activeProfile().short}:Q`, qAnchor.row, qAnchor.col);
    });

    els.profileRows.addEventListener("click", event => {
      const row = event.target.closest(".profile-row");
      const actionTarget = event.target.closest("[data-profile-action]");
      if (!row || !actionTarget) return;
      const profile = profileById(row.dataset.profileId);
      if (!profile) return;
      const viewAnchor = captureViewAnchor();
      const action = actionTarget.dataset.profileAction;
      releaseControlFocus(event);

      if (action === "activate") {
        activateProfile(profile, { viewAnchor });
      } else if (action === "bindBassBase") {
        bassProfile.baseCoord = { ...selectedCoord };
        const bassBaseSource = sourceFromCoord(bassProfile.baseCoord.row, bassProfile.baseCoord.col);
        renderMappingProfileOptions();
        renderBassDock();
        updateBassVoices();
        setReadout(bassBaseSource.dataset.label, `${tr("bassBase")} · ${bassBaseSource.dataset.hz} Hz · MIDI ${bassBaseSource.dataset.midi}`);
      } else if (action === "bindQ") {
        activeProfileId = profile.id;
        setActiveAnchor(selectedCoord);
        includeProfileHardwareRange(profile);
        renderMappingProfileOptions();
        renderKeyboard({ viewAnchor });
        updateReadoutForCoord(`${profile.short}:Q`, qAnchor.row, qAnchor.col);
      } else if (action === "resetQ") {
        activeProfileId = profile.id;
        setActiveAnchor({ row: 1, col: 0 });
        selectedCoord = { ...qAnchor };
        includeProfileHardwareRange(profile);
        renderMappingProfileOptions();
        renderKeyboard({ viewAnchor });
        updateReadoutForCoord(`${profile.short}:Q`, qAnchor.row, qAnchor.col);
      } else if (action === "remove") {
        removeActiveKeyboard(profile);
      } else if (action === "addHid") {
        addHidKeyboard();
      } else if (action === "toggleBassKeyMode") {
        setBassKeyMode(bassUsesFunctionKeys() ? "digits" : "function");
      }
    });

    els.profileRows.addEventListener("change", event => {
      const field = event.target.dataset.profileField;
      if (!field) return;
      const row = event.target.closest(".profile-row");
      const profile = profileById(row?.dataset.profileId);
      if (!profile) return;
      releaseControlFocus(event);

      if (field === "enabled") {
        setProfileEnabled(profile, event.target.checked);
      } else if (field === "outHarmony") {
        bassProfile.outHarmony = event.target.checked;
        const activeCodes = activeBassKeyCodes();
        for (const code of [...bassProfile.pressedCodes]) {
          if (!activeCodes.has(code)) bassProfile.pressedCodes.delete(code);
        }
        bassProfile.suppressedTriadCodes.clear();
        const viewAnchor = captureViewAnchor();
        renderBassDock();
        renderKeyboard({ viewAnchor });
        updateBassVoices();
      } else if (field === "instrument") {
        profile.instrument = event.target.value;
        stopAllVoices();
      } else if (field === "outputShift") {
        profile.outputShift = clampNumber(event.target.value, 0, -24, 24);
        event.target.value = profile.outputShift;
        stopAllVoices();
        renderScaleStaff();
      } else if (field === "volume") {
        profile.volume = clampFloat(event.target.value, DEFAULT_PROFILE_VOLUME, 0, 1);
        event.target.value = profile.volume;
        event.target.closest(".profile-volume")?.querySelector("[data-profile-volume-output]")?.replaceChildren(volumeLabel(profile.volume));
        applyProfileOutputGain(profile);
      } else if (field === "longVibrato") {
        profile.longVibrato = event.target.checked;
        if (!profile.longVibrato) clearLongVibratoForProfile(profile);
      } else if (field === "sustainEnabled") {
        profile.sustainEnabled = event.target.checked;
        if (!profile.sustainEnabled) {
          setSustainPedal(profile, false);
          releaseSustainedVoices(profile, 0.08);
          if (!anySustainPedalActive()) releaseSustainedVoices(pointerProfile, 0.08);
        }
      } else if (field === "fadeSustainTime") {
        pointerProfile.fadeSustainTime = clampFloat(event.target.value, DEFAULT_POINTER_FADE_TIME, 0.1, 3);
        event.target.value = pointerProfile.fadeSustainTime;
        event.target.closest(".profile-volume")?.querySelector("[data-profile-fade-output]")?.replaceChildren(formatSeconds(pointerProfile.fadeSustainTime));
      } else if (field === "bassFadeTime") {
        bassProfile.fadeTime = clampFloat(event.target.value, DEFAULT_BASS_FADE_TIME, 0, 2);
        event.target.value = bassProfile.fadeTime;
        event.target.closest(".profile-volume")?.querySelector("[data-profile-bass-fade-output]")?.replaceChildren(formatSeconds(bassProfile.fadeTime));
      } else if (field === "followSustainPedal") {
        pointerProfile.followSustainPedal = event.target.checked;
        if (pointerProfile.followSustainPedal && !anySustainPedalActive()) releaseSustainedVoices(pointerProfile, 0.08);
      }

      renderMappingProfileOptions();
      updatePedalSwitches();
      if (profile.id === activeProfileId) updateReadoutForCoord(`${profile.short}:Q`, qAnchor.row, qAnchor.col);
    });

    els.profileRows.addEventListener("input", event => {
      const field = event.target.dataset.profileField;
      if (field !== "outputShift" && field !== "volume" && field !== "fadeSustainTime" && field !== "bassFadeTime") return;
      const row = event.target.closest(".profile-row");
      const profile = profileById(row?.dataset.profileId);
      if (!profile) return;
      if (field === "outputShift") {
        profile.outputShift = clampNumber(event.target.value, 0, -24, 24);
      } else if (field === "volume") {
        profile.volume = clampFloat(event.target.value, DEFAULT_PROFILE_VOLUME, 0, 1);
        event.target.closest(".profile-volume")?.querySelector("[data-profile-volume-output]")?.replaceChildren(volumeLabel(profile.volume));
        applyProfileOutputGain(profile);
      } else if (field === "fadeSustainTime") {
        pointerProfile.fadeSustainTime = clampFloat(event.target.value, DEFAULT_POINTER_FADE_TIME, 0.1, 3);
        event.target.closest(".profile-volume")?.querySelector("[data-profile-fade-output]")?.replaceChildren(formatSeconds(pointerProfile.fadeSustainTime));
      } else if (field === "bassFadeTime") {
        bassProfile.fadeTime = clampFloat(event.target.value, DEFAULT_BASS_FADE_TIME, 0, 2);
        event.target.closest(".profile-volume")?.querySelector("[data-profile-bass-fade-output]")?.replaceChildren(formatSeconds(bassProfile.fadeTime));
      }
    });

    els.bassDock.addEventListener("pointerdown", event => {
      const seventhButton = event.target.closest("[data-bass-seventh-index]");
      if (seventhButton && bassProfile.enabled) {
        event.preventDefault();
        const index = Number(seventhButton.dataset.bassSeventhIndex);
        bassProfile.activePointerSevenths.set(event.pointerId, index);
        seventhButton.setPointerCapture?.(event.pointerId);
        const wasSeventhActive = isBassSeventhActive();
        bassProfile.pressedSevenths.add(index);
        updateBassVoicesForRecognition(wasSeventhActive);
        return;
      }

      const button = event.target.closest("[data-bass-code]");
      if (!button || !bassProfile.enabled) return;
      event.preventDefault();
      const code = button.dataset.bassCode;
      bassProfile.activePointerCodes.set(event.pointerId, code);
      button.setPointerCapture?.(event.pointerId);
      handleBassCodeDown(code);
    });

    function releaseBassPointer(event) {
      const seventhIndex = bassProfile.activePointerSevenths.get(event.pointerId);
      if (seventhIndex !== undefined) {
        event.preventDefault();
        bassProfile.activePointerSevenths.delete(event.pointerId);
        bassProfile.pressedSevenths.delete(seventhIndex);
        updateBassVoices();
        return;
      }

      const code = bassProfile.activePointerCodes.get(event.pointerId);
      if (!code) return;
      event.preventDefault();
      bassProfile.activePointerCodes.delete(event.pointerId);
      handleBassCodeUp(code);
    }

    els.bassDock.addEventListener("pointerup", releaseBassPointer);
    els.bassDock.addEventListener("pointercancel", releaseBassPointer);

    els.keySystem.addEventListener("change", event => {
      releaseControlFocus(event);
      const viewAnchor = captureViewAnchor();
      renderKeyboard({ viewAnchor });
      updateReadoutForCoord(currentSystem().label, qAnchor.row, qAnchor.col);
    });

    for (const control of [els.lowCol, els.highCol, els.upperRows, els.lowerRows, els.labelMode, els.keyShape, els.scaleInTone, els.scaleOutTone]) {
      control.addEventListener("change", event => {
        releaseControlFocus(event);
        scheduleRender();
      });
      control.addEventListener("input", scheduleRender);
    }

    els.colorNext.addEventListener("click", event => {
      releaseControlFocus(event);
      shiftKeyboardColor(1);
    });

    els.resetView.addEventListener("click", event => {
      releaseControlFocus(event);
      resetVisibleRangeAndQ();
    });

    els.vibratoSensitivity.addEventListener("change", releaseControlFocus);

    els.sustainTime.addEventListener("input", updatePedalOptionOutputs);
    els.sustainTime.addEventListener("change", event => {
      releaseControlFocus(event);
      updatePedalOptionOutputs();
    });

    els.pedalFadeTime.addEventListener("input", updatePedalOptionOutputs);
    els.pedalFadeTime.addEventListener("change", event => {
      releaseControlFocus(event);
      updatePedalOptionOutputs();
    });

    els.softPedalRatio.addEventListener("input", () => {
      updatePedalOptionOutputs();
      for (const profile of mappingProfiles) applyProfileOutputGain(profile);
    });
    els.softPedalRatio.addEventListener("change", event => {
      releaseControlFocus(event);
      updatePedalOptionOutputs();
      for (const profile of mappingProfiles) applyProfileOutputGain(profile);
    });

    els.glissandoDwell.addEventListener("input", updatePedalOptionOutputs);
    els.glissandoDwell.addEventListener("change", event => {
      releaseControlFocus(event);
      updatePedalOptionOutputs();

    els.sustainPedalToggle.addEventListener("click", event => {
      releaseControlFocus(event);
      const profile = pedalControlProfile();
      setSustainPedal(profile, !profile.sustainPedal);
    });

    els.softPedalToggle.addEventListener("click", event => {

      setSoftPedal(profile, !profile.softPedal);
    });

    els.metronomeToggle.addEventListener("click", event => {
      releaseControlFocus(event);
      if (metronomeActive) stopMetronome();
      else startMetronome();
    });

    for (const button of els.metronomeStepButtons) {
      button.addEventListener("click", event => {
        releaseControlFocus(event);
        adjustMetronome(Number(button.dataset.metronomeStep) || 0);
      });

    els.showStaff.addEventListener("change", event => {
      releaseControlFocus(event);
      syncStaffVisibility();
    });

    els.vibratoPad.addEventListener("pointermove", updateBendFromPointer);
    els.vibratoPad.addEventListener("pointerleave", () => setManualBend(0));
    els.vibratoPad.addEventListener("pointercancel", () => setManualBend(0));

    els.menuTabs.addEventListener("click", event => {
      const panelButton = event.target.closest("[data-menu-panel]");
      if (panelButton) {
        releaseControlFocus(event);
        showMenuPanel(panelButton.dataset.menuPanel);
        return;
      }

      if (event.target.closest("#menuCollapse")) {
        releaseControlFocus(event);
        toggleMenuCollapse();
      }
    });

    els.scaleZoomOut.addEventListener("click", event => {
      releaseControlFocus(event);
      changeStaffZoom(-0.15);
    });

    els.scaleZoomIn.addEventListener("click", event => {
      releaseControlFocus(event);
      changeStaffZoom(0.15);
    });

    els.tonicSelect.addEventListener("change", event => {
      releaseControlFocus(event);
      scheduleRender();
      renderScaleStaff();
      renderBassDock();
      updateBassVoices();
    });
    els.scaleMode.addEventListener("change", event => {
      releaseControlFocus(event);
      scheduleRender();
      renderScaleStaff();
      renderBassDock();
      updateBassVoices();
    });

    if ("hid" in navigator) {
      navigator.hid.addEventListener("disconnect", event => {
        const profile = mappingProfiles.find(item => item.device === event.device);
        if (!profile) return;
        releaseProfilePressedCodes(profile);
        if (activeProfileId === profile.id) {
          activeProfileId = "main";
          syncQAnchorFromActiveProfile();
          selectedCoord = { ...qAnchor };
          renderMappingProfileOptions();
          syncProfileControls();
          includeProfileHardwareRange();
          renderKeyboard();
        }
        setReadout("HID", tr("hidDisconnected", { name: profile.label }));
      });
    }

    populateTonicSelect();
    populateLanguageSelect();
    applyTranslations();
    renderMappingProfileOptions();
    syncProfileControls();
    includeProfileHardwareRange();
    renderKeyboard({ keepScroll: false });
    renderScaleStaff();
    renderBassDock();
    updateReadoutForCoord(`${activeProfile().short}:Q`, qAnchor.row, qAnchor.col);
  </script>
</body>
</html>
